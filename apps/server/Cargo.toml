[package]
name = "protolive-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Google公式 Rust Protobuf。protoc 36.2 と対応(x.y.z ↔ protoc y.z)するため `=` で固定する。
protobuf = "=4.36.2-release"

[build-dependencies]
protobuf-codegen = "=4.36.2-release"
